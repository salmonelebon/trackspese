  <main class="container">

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Le 3:12</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      background: #0b0b0d;
      color: #eee;
    }

    .container { width: 100%; max-width: 700px; padding: 24px; }

    h1 { font-size: 48px; letter-spacing: 4px; margin-bottom: 8px; }
    .subtitle { color: #999; margin-bottom: 32px; }

    #scene-img {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 20px;
      border: 2px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #text { font-size: 20px; line-height: 1.7; min-height: 150px; cursor: pointer; }

    #choices { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

    button {
      padding: 14px 20px;
      font-size: 17px;
      font-family: inherit;
      text-align: left;
      color: #fff;
      background: #1c1c21;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    button:hover { background: #2a2a31; border-color: #e50914; }

    #start-btn, #restart-btn {
      background: #e50914;
      border-color: #e50914;
      text-align: center;
    }
    #start-btn:hover, #restart-btn:hover { background: #f6121d; }

    #timer { height: 6px; background: #222; border-radius: 3px; margin-top: 24px; overflow: hidden; }
    #timer-bar { height: 100%; width: 100%; background: #e50914; }

    #ending { margin-top: 24px; padding-top: 16px; border-top: 1px solid #333; }
    #ending h2 { color: #e50914; margin-bottom: 4px; }
    #counter { color: #999; }

    .hint { margin-top: 32px; font-size: 13px; color: #555; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="container">

    <section id="start-screen">
      <h1>Le 3:12</h1>
      <p class="subtitle">Una storia interattiva. Le tue scelte decidono come va a finire.</p>
      <button id="start-btn">Inizia</button>
    </section>

    <section id="game" class="hidden">
      <canvas id="scene-img" width="24" height="16"></canvas>
      <p id="text"></p>
      <div id="timer" class="hidden"><div id="timer-bar"></div></div>
      <div id="choices"></div>
      <div id="ending" class="hidden">
        <h2 id="ending-title"></h2>
        <p id="counter"></p>
        <button id="restart-btn">Ricomincia</button>
      </div>
      <p class="hint">Clicca sul testo per mostrarlo subito per intero</p>
    </section>

  </main>

<script>
/* =====================================================

   Ogni disegno è 24 pixel di larghezza e 16 di altezza.
   Ogni carattere è un pixel, il colore dipende dalla
   tavolozza (palette) qui sotto. Il punto "." è vuoto.
   ===================================================== */

const palette = {
  "0": "#16161c",  // quasi nero
  "1": "#555b66",  // grigio scuro
  "2": "#9aa0aa",  // grigio chiaro

  "r": "#e50914",  // rosso
  "b": "#3a7bd5",  // blu

  "y": "#f2c94c",  // giallo
  "n": "#8b5a2b",  // marrone

  "p": "#c9a27e"   // pelle

const sprites = {

    ".....1nNNNNyyNNNNn1.....",

    ".....1nnnnnnnnnyyn1.....",
    ".....1nnnnnnnnnnnn1.....",
    ".....1nNNNNNNNNNNn1.....",

    "..11y00y11111111000011..",

    "..2000000000000000000 2..".replace(" ", ""),
    "..2000000000000000000 2..".replace(" ", ""),
    "..200rrr....r..rrr000 2..".replace(" ", ""),

    "..200rrr....r..rrr000 2..".replace(" ", ""),
    "..200..r.r..r..r..000 2..".replace(" ", ""),
    "..200rrr...rrr.rrr000 2..".replace(" ", ""),
    "..2000000000000000000 2..".replace(" ", ""),

/* =====================================================
   LA STORIA
   image = nome del disegno da mostrare nella scena
   ===================================================== */

const story = {

  start: {
    image: "phone",
    text: "Sono le 3:12 di notte. Il telefono vibra sul comodino. Un numero sconosciuto: «Non aprire la porta. Sono già dentro casa tua.» Un attimo dopo, qualcuno bussa.",
    choices: [

      { text: "Non fare niente e restare a letto", next: "ignora" }

    default: 2
  },

  spioncino: {
    image: "door",
    text: "Dallo spioncino vedi una figura di spalle, ferma sul pianerottolo. Indossa il tuo stesso cappotto, quello con la toppa sul gomito. Bussa ancora, tre colpi lenti.",
    choices: [
      { text: "Aprire la porta", next: "apri" },

    default: 1
  },

  polizia: {
    image: "phone",
    text: "L'operatore risponde subito e ti ascolta senza fare domande. «Una pattuglia è già sotto casa sua. Non apra a nessuno.» Poi aggiunge: «Resti in linea.»",
    choices: [
      { text: "Restare in linea", next: "linea" },
      { text: "Controllare dalla finestra", next: "finestra" }
    ],
    default: 0
  },

  ignora: {
    image: "window",
    text: "I colpi smettono. Per un minuto c'è solo silenzio. Poi senti dei passi lenti in cucina e il rumore di un cassetto che si apre.",
    choices: [
      { text: "Prendere la torcia e andare in cucina", next: "cucina" },
      { text: "Chiuderti in bagno", next: "bagno" }
    ],
    default: 1
  },

  chiedi: {
    image: "door",
    text: "«Chi è?» La risposta arriva subito, attraverso la porta. È la tua voce, identica. «Sono io. Ho pochi minuti. Devi uscire dalla finestra, adesso.»",
    choices: [
      { text: "Fidarti e uscire dalla finestra", next: "fuga" },
      { text: "Non fidarti e chiamare la polizia", next: "polizia" }
    ],
    default: 1
  },

  cucina: {
    image: "note",
    text: "In cucina la luce è accesa, ma non c'è nessuno. Sul tavolo trovi un biglietto piegato in due, scritto con la tua calligrafia.",
    choices: [
      { text: "Leggere il biglietto", next: "biglietto" },
      { text: "Spegnere la luce e nasconderti in bagno", next: "bagno" }

    text: "Il biglietto dice: «Se apri la porta, tutto ricomincia da capo. Esci dalla finestra. Non ci sono altre possibilità.» Il bussare riprende, più forte.",

/* =====================================================
   MOTORE DEL GIOCO
   ===================================================== */

const startScreen = document.getElementById("start-screen");
const gameEl = document.getElementById("game");
const textEl = document.getElementById("text");
const choicesEl = document.getElementById("choices");
const timerEl = document.getElementById("timer");
const timerBar = document.getElementById("timer-bar");
const endingEl = document.getElementById("ending");
const endingTitle = document.getElementById("ending-title");
const counterEl = document.getElementById("counter");
const imgCanvas = document.getElementById("scene-img");
const imgCtx = imgCanvas.getContext("2d");

const TIMER_SECONDS = 10;   // tempo per scegliere
const TYPE_SPEED = 25;      // millisecondi per lettera

const TOTAL_ENDINGS = Object.values(story).filter(s => s.ending).length;

let currentScene = null;
let typingInterval = null;
let timerInterval = null;
let finishTyping = null;

let foundEndings = [];
try {
  foundEndings = JSON.parse(localStorage.getItem("storyEndings")) || [];
} catch (e) {
  foundEndings = [];
}

function drawImage(name) {
  const rows = sprites[name];
  imgCtx.fillStyle = "#101018";
  imgCtx.fillRect(0, 0, 24, 16);
  if (!rows) return;

  rows.forEach((row, y) => {
    for (let x = 0; x < 24 && x < row.length; x++) {
      const color = palette[row[x]];
      if (color) {
        imgCtx.fillStyle = color;
        imgCtx.fillRect(x, y, 1, 1);
      }
    }
  });
}

function showScene(id) {
  clearInterval(typingInterval);
  clearInterval(timerInterval);

  currentScene = story[id];
  choicesEl.innerHTML = "";
  timerEl.classList.add("hidden");
  endingEl.classList.add("hidden");

  drawImage(currentScene.image);

  typeText(currentScene.text, () => {
    if (currentScene.ending) {
      showEnding(id);
    } else {
      showChoices();
    }
  });
}

function typeText(text, onDone) {
  let i = 0;
  textEl.textContent = "";

  finishTyping = () => {
    clearInterval(typingInterval);
    typingInterval = null;
    finishTyping = null;
    textEl.textContent = text;
    onDone();
  };

  typingInterval = setInterval(() => {
    i++;
    textEl.textContent = text.slice(0, i);
    if (i >= text.length) {
      finishTyping();
    }
  }, TYPE_SPEED);
}

function showChoices() {
  currentScene.choices.forEach((choice, index) => {
    const btn = document.createElement("button");
    btn.textContent = choice.text;
    btn.addEventListener("click", () => choose(index));
    choicesEl.appendChild(btn);
  });
  startTimer();
}

function startTimer() {
  const total = TIMER_SECONDS * 1000;
  const startTime = Date.now();
  timerEl.classList.remove("hidden");
  timerBar.style.width = "100%";

  timerInterval = setInterval(() => {
    const left = total - (Date.now() - startTime);
    timerBar.style.width = Math.max(0, (left / total) * 100) + "%";
    if (left <= 0) {
      choose(currentScene.default);
    }
  }, 50);
}

function choose(index) {
  clearInterval(timerInterval);
  showScene(currentScene.choices[index].next);
}

function showEnding(id) {
  if (!foundEndings.includes(id)) {
    foundEndings.push(id);
    try {
      localStorage.setItem("storyEndings", JSON.stringify(foundEndings));
    } catch (e) {}
  }
  endingTitle.textContent = currentScene.title;
  counterEl.textContent = "Finali scoperti: " + foundEndings.length + " su " + TOTAL_ENDINGS;
  endingEl.classList.remove("hidden");
}

textEl.addEventListener("click", () => {
  if (finishTyping) finishTyping();
});

document.getElementById("start-btn").addEventListener("click", () => {
  startScreen.classList.add("hidden");
  gameEl.classList.remove("hidden");
  showScene("start");
});

document.getElementById("restart-btn").addEventListener("click", () => {
  showScene("start");
});
</script>
